<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Tahm King</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <script src="../java/java.js" defer></script>
    <script src="../java/producto-card.js" defer></script>
    <script src="../java/panel.js" defer></script>
</head>
<body class="menu-page" style="background-color: #000; padding-top: 20px;">

<main class="catalogo-main">
    <div class="carta-wrapper panel-mode">

        <h1 style="color: #fff; text-align: center; margin-bottom: 30px; font-family: 'Oswald', sans-serif; letter-spacing: 2px;">
            <i class="fa-solid fa-gear" style="color: #ff0000;"></i> PANEL DE TRABAJADOR
        </h1>

        <div style="display:flex;gap:12px;margin-bottom:30px; flex-wrap: wrap;">
            <button class="cat-btn active" data-tab="productos">Productos y Ofertas</button>
            <button class="cat-btn" data-tab="nuevo">Añadir producto</button>
            <button class="cat-btn" data-tab="nueva-oferta">Añadir oferta</button>
            <a href="../index.html" class="cat-btn cancel action-btn" id="btn-logout" style="margin-left:auto; background-color: #ff2a2a; color: white; text-decoration: none; display: flex; align-items: center; gap: 8px;">
                <i class="fa-solid fa-right-from-bracket"></i> SALIR
            </a>
        </div>

        <div id="tab-productos">
            <div data-xlu-include-file="../components/carta.html"></div>
        </div>

        <div id="tab-nueva-oferta" style="display:none;">
            <div style="max-width:600px;">
                <h2 style="color:#fff;margin-bottom:24px;">Añadir nueva oferta</h2>
                <div style="display:flex;flex-direction:column;gap:16px;">
                    <div><input id="oferta-nombre" type="text" placeholder="Nombre de la oferta" style="width:100%;background:#1a1a1a;border:1px solid #444;color:#fff;padding:10px;border-radius:6px;"></div>
                    <div><input id="oferta-desc" type="text" placeholder="Descripción breve" style="width:100%;background:#1a1a1a;border:1px solid #444;color:#fff;padding:10px;border-radius:6px;"></div>
                    <div><input id="oferta-precio" type="number" step="0.01" placeholder="Precio (€)" style="width:100%;background:#1a1a1a;border:1px solid #444;color:#fff;padding:10px;border-radius:6px;"></div>
                    <div><input id="oferta-imagen" type="text" placeholder="img/oferta-home.jpg" style="width:100%;background:#1a1a1a;border:1px solid #444;color:#fff;padding:10px;border-radius:6px;"></div>
                    <button class="btn-main" id="btn-anadir-oferta" style="margin-top:8px;">AÑADIR OFERTA</button>
                </div>
            </div>
        </div>

        <div id="tab-nuevo" style="display:none;">
            <div style="max-width:600px;">
                <h2 style="color:#fff;margin-bottom:24px;">Añadir nuevo producto</h2>
                <div style="display:flex;flex-direction:column;gap:16px;">
                    <div><input id="new-nombre" type="text" placeholder="Nombre del producto" style="width:100%;background:#1a1a1a;border:1px solid #444;color:#fff;padding:10px;border-radius:6px;"></div>
                    <div><input id="new-desc" type="text" placeholder="Descripción" style="width:100%;background:#1a1a1a;border:1px solid #444;color:#fff;padding:10px;border-radius:6px;"></div>
                    <div style="display:flex; gap:16px;">
                        <div style="flex:1;"><input id="new-precio" type="number" step="0.01" placeholder="Precio (€)" style="width:100%;background:#1a1a1a;border:1px solid #444;color:#fff;padding:10px;border-radius:6px;"></div>
                        <div style="flex:1;"><select id="new-categoria" style="width:100%;background:#1a1a1a;border:1px solid #444;color:#fff;padding:10px;border-radius:6px;"></select></div>
                    </div>
                    <div><label style="color:#ccc;font-size:13px;">Alérgenos</label><div id="new-alergenos" style="display:flex;flex-wrap:wrap;gap:12px;background:#1a1a1a;border:1px solid #444;padding:10px;border-radius:6px;"></div></div>
                    <div><input id="new-imagen" type="text" placeholder="img/burger-placeholder.png" style="width:100%;background:#1a1a1a;border:1px solid #444;color:#fff;padding:10px;border-radius:6px;"></div>
                    <button class="btn-main" id="btn-anadir" style="margin-top:8px;">AÑADIR PRODUCTO</button>
                </div>
            </div>
        </div>

    </div>
</main>

</body>
</html>
