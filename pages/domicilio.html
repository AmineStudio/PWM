<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Datos de Envío | Tahm King</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="body-domicilio">

<main class="seccion-domicilio">
  <div class="domicilio-container-xl">

    <div class="domicilio-banner-top">
      <i class="fa-solid fa-map-location-dot"></i>
      <span>¿En qué lugar quieres recibir el pedido?</span>
    </div>

    <div class="domicilio-caja-xl">
      <form class="domicilio-formulario-xl" action="pago.html">

        <input type="text" placeholder="DIRECCIÓN" required>
        <input type="text" placeholder="CÓDIGO POSTAL" required>
        <input type="tel" placeholder="TELÉFONO" required>

        <button type="submit" class="btn-enviar-domicilio-xl">CONTINUAR AL PAGO</button>

      </form>
    </div>

  </div>
</main>

</body>
</html>
