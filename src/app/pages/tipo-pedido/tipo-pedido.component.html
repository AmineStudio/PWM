<div class="fondo-oscuro-estetico">
  <div class="contenedor-tipo-pedido">
    <div class="logo-central-oscuro">
      <img src="assets/img/logo.png" alt="Logo Tahm King">
    </div>

    <div class="textos-cabecera">
      <h2>¡BIENVENIDO A TAHM KING!</h2>
      <p>Selecciona cómo quieres disfrutar de tu comida.</p>
    </div>

    <div class="lista-opciones-oscuras">
      @for (opcion of opciones; track opcion.id) {
        <div class="tarjeta-con-foto"
             [class]="opcion.clase"
             (click)="seleccionarOpcion(opcion.id)">

          <div class="tarjeta-opcion-bg"></div>

          <div class="tarjeta-opcion-contenido">
            <div class="icono-dorado">
              <i class="fa-solid {{ opcion.icono }}" style="font-size: 40px; margin-bottom: 15px;"></i>
            </div>
            <div class="boton-dorado">{{ opcion.titulo }}</div>
            <p class="descripcion-opcion">{{ opcion.descripcion }}</p>
          </div>
        </div>
      }
    </div>

    <button class="btn-cancelar-oscuro" (click)="volver()">VOLVER</button>
  </div>
</div>
