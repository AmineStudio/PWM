<div class="login-body">
  <div class="container" [class.active]="isSignUpActive" id="container">

    <div class="form-container sign-up">
      <form>
        <h1>Créate una cuenta</h1>
        <div class="social-icons">
          <a href="#"><i class="fa-brands fa-google-plus-g"></i></a>
          <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
          <a href="#"><i class="fa-brands fa-instagram"></i></a>
          <a href="#"><i class="fa-brands fa-tiktok"></i></a>
        </div>
        <span>o usa tu correo para registrarte</span>
        <input type="text" placeholder="Nombre" #nombreReg>
        <input type="email" placeholder="Email" #emailReg>
        <input type="password" placeholder="Contraseña" #passReg>
        <button type="button" (click)="registrar(nombreReg.value, emailReg.value, passReg.value)">Regístrate</button>
      </form>
    </div>

    <div class="form-container sign-in">
      <form>
        <h1>Inicia Sesión</h1>
        <div class="social-icons">
          <a href="#"><i class="fa-brands fa-google-plus-g"></i></a>
          <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
          <a href="#"><i class="fa-brands fa-instagram"></i></a>
          <a href="#"><i class="fa-brands fa-tiktok"></i></a>
        </div>
        <span>o usa tu correo y contraseña</span>
        <input type="email" placeholder="Email" #emailLog>
        <input type="password" placeholder="Contraseña" #passLog>
        <a href="#">¿Has olvidado la contraseña?</a>
        <button type="button" (click)="iniciarSesion(emailLog.value, passLog.value)">Inicia sesión</button>
      </form>
    </div>

    <div class="toggle-container">
      <div class="toggle">
        <div class="toggle-panel toggle-left">
          <h1>¡Bienvenido!</h1>
          <p>Introduce tus datos y disfruta de todas las ventajas</p>
          <button class="hidden" (click)="togglePanel(false)">Inicia Sesión</button>
        </div>
        <div class="toggle-panel toggle-right">
          <h1>¡Únete a Tahm King!</h1>
          <p>Regístrate y te regalamos 50 Tahm Coins</p>
          <button class="hidden" (click)="togglePanel(true)">Regístrate</button>
        </div>
      </div>
    </div>

  </div>
</div>
